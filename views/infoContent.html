<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מידע על התוכן</title>
    <link rel="stylesheet" href="/css/infoContent.css">
</head>
<body>
    <nav class="navbar">
        <a class="brand-logo" href="/feed"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
        <div class="nav-links">
            <a class="active" href="/feed">בית</a>
            <a href="/contents">קטלוג</a>
            <!-- <a href="/watch-history">היסטוריה</a> -->
            <a href="/profilesmanage" id="manage-profiles-link" class="admin-only" style="display: none;">ניהול פרופילים</a>
            <a href="/admin" class="admin-only" style="display: none;">ניהול תכנים</a>
        </div>
        <div class="left-nav">
            <a href="#" id="logout-link">התנתק</a>
            <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Netflix-avatar.png" alt="סמל פרופיל" class="avatar">
        </div>
    </nav>

    <main class="infoContent-main">
        <div class="movie-info-container">
            <!-- 1. שם הסרט בראש העמוד -->
            <h1 id="movie-title" class="main-movie-title">טוען שם סרט...</h1>

            <!-- 2. מסגרת הוידאו הדומיננטית -->
            
            <div class="video-frame-wrapper">
                <iframe id="movie-trailer" 
                        src="" 
                        
                        title="Movie Trailer" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
                
                <iframe id="cover-movie-trailer" 
                        src="" 
                        
                        title="Movie Trailer" 
                        frameborder="0" 
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                        allowfullscreen>
                </iframe>
                <div class="coverTheFrame" id="coverTheFrame"></div>
            </div>
            
            <!-- מיכל שבו יוטיוב תשתול את הנגן אוטומטית -->
            

            <!-- 3. פרטי הסרט: תיאור ודירוג -->
            <div class="movie-meta-details">
                <div class="rating-box">
                    <span class="rating-label">דירוג גולשים:</span>
                    <span id="movie-rating" class="rating-value">⭐ 0.0</span>
                </div>
                <!-- <span class="title-description">תיאור:</span> -->
                 <h4 class="title-description">תיאור:</h4>
                <p id="movie-description" class="movie-description-text">
                    טוען תיאור סרט...
                </p>
            </div>

            <!-- 4. אזור התגובות (יווצר בהמשך) -->
            <div class="comments-section-placeholder">
                <h3>💬 תגובות גולשים</h3>
                <!-- <p>מערכת התגובות תהיה זמינה בקרוב...</p> -->

                <!-- חלון נגלל להצגת טקסט התגובות בלבד -->
                <div id="commentsContainer" class="comments-scroll-box">
                    <!-- כאן יופיעו התגובות באופן דינמי דרך ה-JavaScript -->
                    <p id="noCommentsMsg" class="no-comments-msg" >אין עדיין תגובות. תהיה הראשון לכתוב!</p>
                </div>

                <!-- טופס הוספת תגובה -->
                <form id="commentForm" class="comment-form">
                <h3>הוסף תגובה וציון</h3>
                
                <!-- בחירת ציון -->
                <div class="form-group">
                    <label for="rating" >ציון (בין 1 ל-10):</label>
                    <input type="number" id="rating" class="form-control" min="1" max="10" step="0.1" placeholder="לדוגמה: 8">
                </div>

                <!-- כתיבת התגובה -->
                <div class="form-group">
                    <label for="text">התגובה שלך:</label>
                    <textarea id="text" class="form-control" placeholder="כתוב את חוות דעתך כאן..."></textarea>
                </div>

                <button type="submit" class="submit-btn">שלח תגובה</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 StreamFlix - פרויקט גמר פיתוח אפליקציות אינטרנטיות</p>
    </footer>

    <script src="/js/infoContent.js"></script>
    <script src="/js/auth.js"></script>
    
</body>
</html>
