<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - התחברות והרשמה</title>
    <link rel="stylesheet" href="/css/index.css">
</head>
<body>
    <header class="main-header" style="position: absolute; z-index:10; ">
        <!-- <h1 class="logo">STREAMFLIX</h1> -->
        <a class="brand-logo" href="/"><img src="/images/netflix-logo.svg" alt="Netflix"></a>
    </header>

    <main class="auth-container">
        <section class="auth-box">
            <!-- לשוניות מעבר בין התחברות להרשמה -->
            <div class="auth-tabs">
                <button id="showLoginTab" class="tab-btn active">התחברות</button>
                <button id="showRegisterTab" class="tab-btn">הרשמה</button>
            </div>

            <!-- טופס התחברות -->
            <form id="loginForm">
                <h2>התחברות למערכת</h2>
                <div class="form-group">
                    <label for="loginEmail">אימייל:</label>
                    <input type="email" id="loginEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="loginPassword">סיסמה:</label>
                    <input type="password" id="loginPassword" required placeholder="הכנס סיסמה">
                </div>
                <button type="submit" class="btn-submit">התחבר</button>
            </form>

            <!-- טופס הרשמה -->
            <form id="registerForm" style="display: none;">
                <h2>הרשמה למערכת</h2>
                <div class="form-group">
                    <label for="name">שם מלא:</label>
                    <input type="text" id="name" required placeholder="הכנס שם מלא">
                </div>
                <div class="form-group">
                    <label for="email">אימייל:</label>
                    <input type="email" id="email" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="password">סיסמה:</label>
                    <input type="password" id="password" required placeholder="הכנס סיסמה">
                </div>
                <button type="submit" class="btn-submit">הירשם עכשיו</button>
            </form>

            <div id="messageBox" class="message-box"></div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 StreamFlix - פרויקט גמר פיתוח אפליקציות אינטרנטיות</p>
    </footer>

    <script src="/js/auth.js"></script>
</body>
</html>
